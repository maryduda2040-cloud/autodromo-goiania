<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Autódromo de Goiânia — Jogo</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #111;

    }


    /* CÂMERA */

    #camera {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;

    }


    /* ÁREA DA PISTA */

    #pistaContainer {

      position: fixed;

      left: 50%;

      bottom: 0;

      width: 100%;

      height: 100%;

      transform: translateX(-50%);

      transform-origin: center bottom;

      z-index: 5;

      pointer-events: none;

    }


    /* PISTA */

    #pista {

      position: absolute;

      left: 50%;

      bottom: 0;

      width: 100%;

      height: auto;

      transform:
        translateX(-50%);

      transform-origin: center bottom;

    }


    /* TELA INICIAL */

    #start {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #111;

      z-index: 10;

    }


    /* BOTÃO */

    button {

      border: none;

      padding: 18px 30px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }

  </style>

</head>


<body>


  <!-- TELA INICIAL -->

  <div id="start">

    <button id="startButton">
      INICIAR CORRIDA
    </button>

  </div>


  <!-- CÂMERA -->

  <video
    id="camera"
    autoplay
    playsinline
  ></video>


  <!-- PISTA -->

  <div id="pistaContainer">

    <img
      id="pista"
      src="pista.png"
      alt=""
    >

  </div>


  <script>


    /* ELEMENTOS */

    const start =
      document.getElementById(
        "start"
      );


    const startButton =
      document.getElementById(
        "startButton"
      );


    const camera =
      document.getElementById(
        "camera"
      );


    const pistaContainer =
      document.getElementById(
        "pistaContainer"
      );


    /*

      GAMMA CENTRAL

    */

    const gammaCentro = 4;


    /*

      MOVIMENTO LATERAL

    */

    let posicaoX = 0;


    /*

      ESCALA DA PISTA

    */

    let escala = 1;


    /*

      CONTROLE DA CORRIDA

    */

    let corridaIniciada = false;

    let ultimoTempo = 0;


    /*
      VELOCIDADE DE CRESCIMENTO

      Vamos começar devagar.

    */

    const velocidade =
      0.08;


    /*
      BOTÃO INICIAR
    */

    startButton.addEventListener(
      "click",
      async () => {


        try {


          /*
            ABRE CÂMERA
          */

          const stream =
            await navigator
              .mediaDevices
              .getUserMedia({

                video: {

                  facingMode:
                    "environment"

                },

                audio: false

              });


          camera.srcObject =
            stream;


          /*
            ESCONDE BOTÃO
          */

          start.style.display =
            "none";


          /*
            ATIVA SENSOR
          */

          ativarSensor();


        }


        catch (error) {


          console.log(
            "Erro da câmera:",
            error
          );

        }

      }
    );


    /*
      SENSOR
    */

    async function ativarSensor() {


      try {


        /*
          PEDIDO DE PERMISSÃO
          QUANDO NECESSÁRIO
        */

        if (

          typeof DeviceOrientationEvent !==
          "undefined"

          &&

          typeof DeviceOrientationEvent
            .requestPermission ===
          "function"

        ) {


          const permission =
            await DeviceOrientationEvent
              .requestPermission();


          if (
            permission !==
            "granted"
          ) {

            return;

          }

        }


        /*
          ESCUTA SENSOR
        */

        window.addEventListener(

          "deviceorientation",

          controlarPista

        );


        /*
          COMEÇA CORRIDA
        */

        iniciarCorrida();


      }


      catch (error) {


        console.log(
          "Erro do sensor:",
          error
        );

      }

    }


    /*
      CONTROLE LATERAL
    */

    function controlarPista(
      event
    ) {


      const gamma =
        event.gamma || 0;


      /*
        DIFERENÇA DO CENTRO
      */

      const diferenca =
        gamma - gammaCentro;


      /*
        MOVIMENTO LATERAL

        Mantemos exatamente
        a lógica que funcionou.

      */

      let alvo =
        -diferenca * 4;


      /*
        LIMITA A MOVIMENTAÇÃO
      */

      alvo =
        Math.max(
          -180,
          Math.min(
            180,
            alvo
          )
        );


      /*
        MOVIMENTO SUAVE
      */

      posicaoX +=
        (alvo - posicaoX)
        * 0.15;


      /*
        APLICA POSIÇÃO LATERAL
      */

      pista.style.transform =

        `translateX(
          calc(-50% + ${posicaoX}px)
        )`;

    }


    /*
      INICIA CORRIDA
    */

    function iniciarCorrida() {


      if (
        corridaIniciada
      ) {

        return;

      }


      corridaIniciada =
        true;


      ultimoTempo =
        performance.now();


      requestAnimationFrame(
        animarCorrida
      );

    }


    /*
      ANIMAÇÃO
    */

    function animarCorrida(
      tempo
    ) {


      if (
        !corridaIniciada
      ) {

        return;

      }


      /*
        TEMPO PASSADO
      */

      const delta =
        (tempo -
          ultimoTempo)
        / 1000;


      ultimoTempo =
        tempo;


      /*
        AUMENTA A PISTA

        Isso cria a sensação
        de aproximação.

      */

      escala +=
        velocidade * delta;


      /*
        LIMITA O CRESCIMENTO

        Para o teste,
        vamos até 1.8x.

      */

      if (
        escala > 1.8
      ) {

        escala = 1;

      }


      /*
        APLICA ESCALA

        O ponto de origem
        fica na parte inferior.

      */

      pista.style.transform =

        `translateX(
          calc(-50% + ${posicaoX}px)
        )
        scale(${escala})`;


      /*
        CONTINUA
      */

      requestAnimationFrame(
        animarCorrida
      );

    }


  </script>

</body>

</html>
