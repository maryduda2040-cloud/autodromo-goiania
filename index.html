<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Autódromo de Goiânia — Jogo</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #111;

    }


    /* CÂMERA */

    #camera {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      z-index: 1;

    }


    /* PISTA */

    #pista {

      position: fixed;

      left: 50%;

      bottom: 0;

      transform:
        translate(
          calc(-50% + 0px),
          0px
        );

      width: 100%;

      height: auto;

      z-index: 5;

      pointer-events: none;

    }


    /* TELA INICIAL */

    #start {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #111;

      z-index: 10;

    }


    /* BOTÃO */

    button {

      border: none;

      padding: 18px 30px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    /* TEXTO */

    #message {

      position: fixed;

      top: 20px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 20;

      color: white;

      background:
        rgba(0, 0, 0, 0.65);

      font-size: 18px;

      font-weight: bold;

      text-align: center;

      padding: 10px;

      border-radius: 8px;

    }

  </style>

</head>


<body>


  <!-- TELA INICIAL -->

  <div id="start">

    <button id="startButton">
      INICIAR CORRIDA
    </button>

  </div>


  <!-- CÂMERA -->

  <video
    id="camera"
    autoplay
    playsinline
  ></video>


  <!-- PISTA -->

  <img
    id="pista"
    src="pista.png"
    alt=""
  >


  <!-- TEXTO -->

  <div id="message"></div>


  <script>


    /* ELEMENTOS */

    const start =
      document.getElementById(
        "start"
      );


    const startButton =
      document.getElementById(
        "startButton"
      );


    const camera =
      document.getElementById(
        "camera"
      );


    const message =
      document.getElementById(
        "message"
      );


    const pista =
      document.getElementById(
        "pista"
      );


    /*

      GAMMA DO CELULAR
      QUANDO CENTRALIZADO

    */

    const gammaCentro = 4;


    /*

      POSIÇÃO LATERAL

    */

    let posicaoPistaX = 0;


    /*

      POSIÇÃO VERTICAL

    */

    let posicaoPistaY = 0;


    /*
      CONTROLE DA ANIMAÇÃO
    */

    let corridaIniciada = false;

    let ultimaAtualizacao = 0;


    /*
      VELOCIDADE DE AVANÇO

      Quanto maior o número,
      mais rápida será a sensação
      de movimento.

    */

    const velocidade =
      80;


    /*
      BOTÃO INICIAR
    */

    startButton.addEventListener(
      "click",
      async () => {


        message.textContent =
          "";


        try {


          /*
            CÂMERA TRASEIRA
          */

          const stream =
            await navigator
              .mediaDevices
              .getUserMedia({

                video: {

                  facingMode:
                    "environment"

                },

                audio: false

              });


          camera.srcObject =
            stream;


          /*
            ESCONDE TELA INICIAL
          */

          start.style.display =
            "none";


          /*
            ATIVA SENSOR
          */

          ativarSensor();


        }


        catch (error) {


          message.textContent =
            "ERRO DA CÂMERA: " +
            error.name +
            " — " +
            error.message;

        }

      }
    );


    /*
      ATIVAR SENSOR
    */

    async function ativarSensor() {


      try {


        /*
          PERMISSÃO DO SENSOR
        */

        if (

          typeof DeviceOrientationEvent !==
          "undefined"

          &&

          typeof DeviceOrientationEvent
            .requestPermission ===
          "function"

        ) {


          const permission =
            await DeviceOrientationEvent
              .requestPermission();


          if (
            permission !==
            "granted"
          ) {


            return;

          }

        }


        /*
          COMEÇA A ESCUTAR
          O SENSOR
        */

        window.addEventListener(

          "deviceorientation",

          mostrarOrientacao

        );


        /*
          COMEÇA A CORRIDA
        */

        iniciarCorrida();


      }


      catch (error) {


        console.log(
          "Erro no sensor:",
          error
        );

      }

    }


    /*
      SENSOR
    */

    function mostrarOrientacao(
      event
    ) {


      /*
        GAMMA ATUAL
      */

      const gamma =
        event.gamma || 0;


      /*
        DIFERENÇA DO CENTRO
      */

      const diferenca =
        gamma - gammaCentro;


      /*
        DESTINO LATERAL
      */

      let alvo =
        -diferenca * 4;


      /*
        LIMITA MOVIMENTO
      */

      alvo =
        Math.max(
          -180,
          Math.min(
            180,
            alvo
          )
        );


      /*
        MOVIMENTO SUAVE
      */

      posicaoPistaX +=
        (alvo - posicaoPistaX)
        * 0.15;


      atualizarPista();

    }


    /*
      INICIA A CORRIDA
    */

    function iniciarCorrida() {


      if (
        corridaIniciada
      ) {

        return;

      }


      corridaIniciada =
        true;


      ultimaAtualizacao =
        performance.now();


      requestAnimationFrame(
        animarPista
      );

    }


    /*
      ANIMAÇÃO DA PISTA
    */

    function animarPista(
      tempo
    ) {


      if (
        !corridaIniciada
      ) {

        return;

      }


      /*
        TEMPO ENTRE FRAMES
      */

      const delta =
        (tempo -
          ultimaAtualizacao)
        / 1000;


      ultimaAtualizacao =
        tempo;


      /*
        AVANÇA A PISTA

        A posição vai subindo
        continuamente.

      */

      posicaoPistaY -=
        velocidade * delta;


      /*
        QUANDO A PISTA SOBE
        DEMAIS, VOLTA PARA BAIXO

        Isso cria um movimento
        contínuo para teste.

      */

      if (
        posicaoPistaY < -300
      ) {

        posicaoPistaY =
          0;

      }


      atualizarPista();


      requestAnimationFrame(
        animarPista
      );

    }


    /*
      ATUALIZA VISUAL
    */

    function atualizarPista() {


      pista.style.transform =

        `translate(
          calc(-50% + ${posicaoPistaX}px),
          ${posicaoPistaY}px
        )`;

    }


  </script>


</body>

</html>
