<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Autódromo de Goiânia — Jogo</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #111;

    }


    /* CÂMERA */

    #camera {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      z-index: 1;

    }


    /* PISTA */

    #pista {

      position: fixed;

      left: 50%;
      bottom: 0;

      transform: translateX(-50%);

      width: 100%;
      height: auto;

      z-index: 5;

      pointer-events: none;

    }


    /* TELA INICIAL */

    #start {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #111;

      z-index: 10;

    }


    /* BOTÃO */

    button {

      border: none;

      padding: 18px 30px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    /* TEXTO */

    #message {

      position: fixed;

      top: 20px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      color: white;

      font-size: 18px;

      font-weight: bold;

      text-align: center;

      text-shadow: 0 2px 5px #000;

      padding: 10px;

    }

  </style>

</head>


<body>


  <!-- TELA INICIAL -->

  <div id="start">

    <button id="startButton">
      INICIAR CORRIDA
    </button>

  </div>


  <!-- CÂMERA -->

  <video
    id="camera"
    autoplay
    playsinline
  ></video>


  <!-- PISTA -->

  <img
    id="pista"
    src="pista.png"
    alt=""
  >


  <!-- TEXTO -->

  <div id="message">
    VIRE O CELULAR
  </div>


  <script>


    /* ELEMENTOS */

    const start =
      document.getElementById("start");

    const startButton =
      document.getElementById("startButton");

    const camera =
      document.getElementById("camera");

    const message =
      document.getElementById("message");


    /* BOTÃO INICIAR */

    startButton.addEventListener(
      "click",
      async () => {


        message.textContent =
          "ABRINDO CÂMERA...";


        try {


          /* CÂMERA TRASEIRA */

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "environment"
              },

              audio: false

            });


          camera.srcObject =
            stream;


          /* ESCONDE TELA INICIAL */

          start.style.display =
            "none";


          /* INSTRUÇÃO */

          message.innerHTML =
            "CÂMERA FUNCIONANDO!<br><br>" +
            "TOQUE AQUI PARA ATIVAR O SENSOR";


          message.style.background =
            "rgba(0,0,0,0.7)";


          message.style.color =
            "white";


          message.style.padding =
            "15px";


          /* ATIVAR SENSOR */

          message.addEventListener(
            "click",
            ativarSensor
          );


        }

        catch (error) {


          message.textContent =
            "ERRO DA CÂMERA: " +
            error.name +
            " — " +
            error.message;

        }

      }
    );


    /* ATIVAR SENSOR */

    async function ativarSensor() {


      message.removeEventListener(
        "click",
        ativarSensor
      );


      try {


        if (

          typeof DeviceOrientationEvent !==
          "undefined"

          &&

          typeof DeviceOrientationEvent
            .requestPermission ===
          "function"

        ) {


          const permission =
            await DeviceOrientationEvent
              .requestPermission();


          if (
            permission !== "granted"
          ) {


            message.textContent =
              "PERMISSÃO DO SENSOR NÃO CONCEDIDA.";

            return;

          }

        }


        /* ATIVA SENSOR */

        window.addEventListener(

          "deviceorientation",

          mostrarOrientacao

        );


        message.innerHTML =
          "VIRE O CELULAR";


      }


      catch (error) {


        message.innerHTML =
          "ERRO DO SENSOR:<br>" +
          error.name +
          " — " +
          error.message;

      }

    }


    /* SENSOR */

    function mostrarOrientacao(event) {

      /*
        Por enquanto não vamos
        movimentar a pista.
        Estamos apenas recebendo
        o sensor.
      */

      const gamma =
        event.gamma || 0;


      message.innerHTML =
        "VIRE O CELULAR<br><br>" +
        "GAMMA: " +
        Math.round(gamma) +
        "°";

    }


  </script>


</body>

</html>
