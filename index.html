<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Teste do Sensor</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #111;

    }


    #camera {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;

    }


    #pista {

      position: fixed;

      left: 50%;

      bottom: 0;

      transform: translateX(-50%);

      width: 100%;
      height: auto;

      z-index: 5;

      pointer-events: none;

    }


    #start {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #111;

      z-index: 10;

    }


    button {

      border: none;

      padding: 18px 30px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    #message {

      position: fixed;

      top: 20px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      color: white;

      background: rgba(0, 0, 0, 0.65);

      font-size: 18px;

      font-weight: bold;

      text-align: center;

      padding: 12px;

      border-radius: 8px;

    }

  </style>

</head>


<body>


  <div id="start">

    <button id="startButton">
      INICIAR CORRIDA
    </button>

  </div>


  <video
    id="camera"
    autoplay
    playsinline
  ></video>


  <img
    id="pista"
    src="pista.png"
    alt=""
  >


  <div id="message">
    VIRE O CELULAR
  </div>


  <script>


    const start =
      document.getElementById("start");

    const startButton =
      document.getElementById("startButton");

    const camera =
      document.getElementById("camera");

    const message =
      document.getElementById("message");


    /*
      BOTÃO INICIAR
    */

    startButton.addEventListener(
      "click",
      async () => {

        message.textContent =
          "ABRINDO CÂMERA...";


        try {

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "environment"
              },

              audio: false

            });


          camera.srcObject =
            stream;


          start.style.display =
            "none";


          message.innerHTML =
            "CÂMERA FUNCIONANDO!<br><br>" +
            "TOQUE AQUI PARA ATIVAR O SENSOR";


          message.addEventListener(
            "click",
            ativarSensor
          );


        }

        catch (error) {

          message.textContent =
            "ERRO DA CÂMERA: " +
            error.name +
            " — " +
            error.message;

        }

      }
    );


    /*
      ATIVAR SENSOR
    */

    async function ativarSensor() {


      message.removeEventListener(
        "click",
        ativarSensor
      );


      try {


        if (

          typeof DeviceOrientationEvent !==
          "undefined"

          &&

          typeof DeviceOrientationEvent
            .requestPermission ===
          "function"

        ) {


          const permission =
            await DeviceOrientationEvent
              .requestPermission();


          if (
            permission !== "granted"
          ) {

            message.textContent =
              "PERMISSÃO DO SENSOR NÃO CONCEDIDA.";

            return;

          }

        }


        window.addEventListener(
          "deviceorientation",
          mostrarOrientacao
        );


      }

      catch (error) {

        message.innerHTML =
          "ERRO DO SENSOR:<br>" +
          error.name +
          " — " +
          error.message;

      }

    }


    /*
      MOSTRA OS TRÊS EIXOS
    */

    function mostrarOrientacao(event) {


      const alpha =
        event.alpha !== null
          ? Math.round(event.alpha)
          : "N/A";


      const beta =
        event.beta !== null
          ? Math.round(event.beta)
          : "N/A";


      const gamma =
        event.gamma !== null
          ? Math.round(event.gamma)
          : "N/A";


      message.innerHTML =

        "ALPHA: " +
        alpha +
        "°<br>" +

        "BETA: " +
        beta +
        "°<br>" +

        "GAMMA: " +
        gamma +
        "°";

    }

  </script>


</body>

</html>
