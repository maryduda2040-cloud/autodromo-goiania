<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autódromo de Goiânia — Jogo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #start {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      z-index: 10;
    }

    button {
      border: none;
      padding: 18px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 2px 5px #000;
    }

    #teste {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 60px;
  color: white;
  z-index: 6;
}
  </style>
</head>

<body>

  <div id="start">
    <button id="startButton">INICIAR CORRIDA</button>
  </div>

  <video id="camera" autoplay playsinline></video>

  <div id="teste">●</div>
  
  <div id="message">
    VIRE O CELULAR
  </div>

  <script>
  const start = document.getElementById("start");
  const startButton = document.getElementById("startButton");
  const camera = document.getElementById("camera");
  const message = document.getElementById("message");

  let sensorAtivo = false;

  startButton.addEventListener("click", async () => {

    message.textContent = "ABRINDO CÂMERA...";

    try {

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment"
        },
        audio: false
      });

      camera.srcObject = stream;

      start.style.display = "none";

      message.innerHTML =
        "CÂMERA FUNCIONANDO!<br><br>" +
        "TOQUE AQUI PARA ATIVAR O SENSOR";

      message.style.background = "rgba(0,0,0,0.7)";
      message.style.color = "white";
      message.style.padding = "15px";

      message.addEventListener("click", ativarSensor);

    } catch (error) {

      message.textContent =
        "ERRO DA CÂMERA: " +
        error.name +
        " — " +
        error.message;

    }
  });


  async function ativarSensor() {

    message.removeEventListener("click", ativarSensor);

    try {

      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {

        const permission =
          await DeviceOrientationEvent.requestPermission();

        if (permission !== "granted") {

          message.textContent =
            "PERMISSÃO DO SENSOR NÃO CONCEDIDA.";

          return;
        }
      }

      window.addEventListener(
        "deviceorientation",
        mostrarOrientacao
      );

      sensorAtivo = true;

      message.innerHTML =
        "SENSOR ATIVADO<br>" +
        "MEXA O CELULAR";

    } catch (error) {

      message.innerHTML =
        "ERRO DO SENSOR:<br>" +
        error.name +
        " — " +
        error.message;

    }
  }


  function mostrarOrientacao(event) {

    const alpha =
      event.alpha !== null
        ? Math.round(event.alpha)
        : "N/A";

    const beta =
      event.beta !== null
        ? Math.round(event.beta)
        : "N/A";

    const gamma =
      event.gamma !== null
        ? Math.round(event.gamma)
        : "N/A";

    const bolinha = document.getElementById("teste");

if (event.gamma !== null) {
  const posicao = 50 + (event.gamma / 45) * 30;

  bolinha.style.left = posicao + "%";
}

    message.innerHTML =
      "SENSOR ATIVO<br><br>" +
      "ALPHA: " + alpha + "°<br>" +
      "BETA: " + beta + "°<br>" +
      "GAMMA: " + gamma + "°";
  }
</script>

</body>
</html>
