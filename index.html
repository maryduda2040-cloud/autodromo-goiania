<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autódromo de Goiânia — Jogo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #pista {
      position: fixed;
      bottom: 0;
      left: 50%;
      width: 100%;
      height: auto;
      z-index: 2;
      pointer-events: none;

      transform: translateX(-50%);
    }

    #start {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      z-index: 10;
    }

    button {
      border: none;
      padding: 18px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 2px 5px #000;
    }
  </style>
</head>

<body>

  <div id="start">
    <button id="startButton">INICIAR CORRIDA</button>
  </div>

  <video id="camera" autoplay playsinline></video>

  <img id="pista" src="pista.png" alt="Pista">

  <div id="message">
    VIRE O CELULAR
  </div>

  <script>
    const start = document.getElementById("start");
    const startButton = document.getElementById("startButton");
    const camera = document.getElementById("camera");
    const message = document.getElementById("message");
    const pista = document.getElementById("pista");

    let sensorAtivo = false;

    let posicaoPista = 0;
    let alvoPista = 0;


    startButton.addEventListener("click", async () => {

      message.textContent = "ABRINDO CÂMERA...";

      try {

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment"
          },
          audio: false
        });

        camera.srcObject = stream;

        start.style.display = "none";

        message.textContent =
          "TOQUE AQUI PARA ATIVAR O SENSOR";

        message.style.background = "rgba(0,0,0,0.7)";
        message.style.color = "white";
        message.style.padding = "15px";

        message.addEventListener("click", ativarSensor);

      } catch (error) {

        message.textContent =
          "ERRO DA CÂMERA";

      }
    });


    async function ativarSensor() {

      message.removeEventListener("click", ativarSensor);

      try {

        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {

          const permission =
            await DeviceOrientationEvent.requestPermission();

          if (permission !== "granted") {

            message.textContent =
              "PERMISSÃO DO SENSOR NÃO CONCEDIDA.";

            return;
          }
        }

        window.addEventListener(
          "deviceorientation",
          mostrarOrientacao
        );

        sensorAtivo = true;

        message.textContent =
          "VIRE O CELULAR";

        animarPista();

      } catch (error) {

        message.textContent =
          "ERRO AO ATIVAR O SENSOR";

      }
    }


    function mostrarOrientacao(event) {

      if (event.gamma !== null) {

        /*
          gamma:
          negativo = celular inclinado para a esquerda
          positivo = celular inclinado para a direita
        */

        alvoPista = -(event.gamma / 45) * 10;

        /*
          Limita o movimento da pista
          para ela não sair demais da tela.
        */

        if (alvoPista > 10) {
          alvoPista = 10;
        }

        if (alvoPista < -10) {
          alvoPista = -10;
        }
      }
    }


    function animarPista() {

      /*
        Faz a pista chegar suavemente
        até a posição desejada.
      */

      posicaoPista +=
        (alvoPista - posicaoPista) * 0.08;

      pista.style.transform =
        "translateX(calc(-50% + " +
        posicaoPista +
        "%))";

      requestAnimationFrame(animarPista);
    }

  </script>

</body>
</html>
