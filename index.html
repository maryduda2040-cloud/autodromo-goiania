<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autódromo de Goiânia — Jogo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #start {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      z-index: 10;
    }

    button {
      border: none;
      padding: 18px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 2px 5px #000;
    }
  </style>
</head>

<body>

  <div id="start">
    <button id="startButton">INICIAR CORRIDA</button>
  </div>

  <video id="camera" autoplay playsinline></video>

  <div id="message">
    VIRE O CELULAR
  </div>

  <script>
  const start = document.getElementById("start");
  const startButton = document.getElementById("startButton");
  const camera = document.getElementById("camera");
  const message = document.getElementById("message");

  startButton.addEventListener("click", async () => {

    message.textContent = "ABRINDO CÂMERA...";

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment"
        },
        audio: false
      });

      camera.srcObject = stream;
      start.style.display = "none";

      // Verifica se o navegador precisa pedir permissão para o sensor
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        const permission = await DeviceOrientationEvent.requestPermission();

        if (permission === "granted") {
          iniciarSensor();
        } else {
          message.textContent = "Permissão do sensor não concedida.";
        }

      } else {
        iniciarSensor();
      }

    } catch (error) {
      message.textContent =
        "ERRO: " + error.name + " — " + error.message;

      message.style.background = "white";
      message.style.color = "black";
      message.style.padding = "15px";
    }
  });


  function iniciarSensor() {

    message.style.background = "rgba(0,0,0,0.7)";
    message.style.color = "white";
    message.style.padding = "10px";

    window.addEventListener("deviceorientation", mostrarOrientacao);
  }


  function mostrarOrientacao(event) {

    const alpha = Math.round(event.alpha || 0);
    const beta = Math.round(event.beta || 0);
    const gamma = Math.round(event.gamma || 0);

    message.innerHTML =
      "VIRE O CELULAR<br>" +
      "Alpha: " + alpha + "°<br>" +
      "Beta: " + beta + "°<br>" +
      "Gamma: " + gamma + "°";
  }
</script>

</body>
</html>
