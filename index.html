<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Autódromo de Goiânia — Jogo</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #111;

    }


    /* CÂMERA */

    #camera {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

    }


    /* TELA INICIAL */

    #start {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #111;

      z-index: 10;

    }


    /* BOTÃO */

    button {

      border: none;

      padding: 18px 30px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    /* TEXTO */

    #message {

      position: fixed;

      top: 20px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 5;

      color: white;

      font-size: 18px;

      font-weight: bold;

      text-align: center;

      text-shadow: 0 2px 5px #000;

      padding: 10px;

    }


    /* BOLINHA DE TESTE */

    #teste {

      position: fixed;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      width: 50px;

      height: 50px;

      border-radius: 50%;

      background: white;

      z-index: 6;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.5);

    }

  </style>

</head>


<body>


  <!-- TELA INICIAL -->

  <div id="start">

    <button id="startButton">
      INICIAR CORRIDA
    </button>

  </div>


  <!-- CÂMERA -->

  <video
    id="camera"
    autoplay
    playsinline
  ></video>


  <!-- TEXTO -->

  <div id="message">
    VIRE O CELULAR
  </div>


  <!-- BOLINHA -->

  <div id="teste"></div>


  <script>


    /* ELEMENTOS */

    const start =
      document.getElementById("start");

    const startButton =
      document.getElementById("startButton");

    const camera =
      document.getElementById("camera");

    const message =
      document.getElementById("message");

    const bolinha =
      document.getElementById("teste");


    /* BOTÃO INICIAR */

    startButton.addEventListener(
      "click",
      async () => {


        message.textContent =
          "ABRINDO CÂMERA...";


        try {


          /* CÂMERA TRASEIRA */

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "environment"
              },

              audio: false

            });


          camera.srcObject = stream;


          /* ESCONDE TELA INICIAL */

          start.style.display =
            "none";


          /* INSTRUÇÃO */

          message.innerHTML =
            "CÂMERA FUNCIONANDO!<br><br>" +
            "TOQUE AQUI PARA ATIVAR O SENSOR";


          message.style.background =
            "rgba(0,0,0,0.7)";


          message.style.color =
            "white";


          message.style.padding =
            "15px";


          /* ATIVAR SENSOR AO TOCAR */

          message.addEventListener(
            "click",
            ativarSensor
          );


        }

        catch (error) {


          message.textContent =
            "ERRO DA CÂMERA: " +
            error.name +
            " — " +
            error.message;

        }

      }
    );


    /* ATIVAR SENSOR */

    async function ativarSensor() {


      message.removeEventListener(
        "click",
        ativarSensor
      );


      try {


        /*
          ALGUNS NAVEGADORES
          PRECISAM DE PERMISSÃO
        */

        if (

          typeof DeviceOrientationEvent !==
          "undefined"

          &&

          typeof DeviceOrientationEvent
            .requestPermission ===
          "function"

        ) {


          const permission =
            await DeviceOrientationEvent
              .requestPermission();


          if (
            permission !== "granted"
          ) {


            message.textContent =
              "PERMISSÃO DO SENSOR NÃO CONCEDIDA.";

            return;

          }

        }


        /* COMEÇA A ESCUTAR O SENSOR */

        window.addEventListener(

          "deviceorientation",

          mostrarOrientacao

        );


        message.innerHTML =
          "SENSOR ATIVADO<br>" +
          "MEXA O CELULAR";


      }


      catch (error) {


        message.innerHTML =
          "ERRO DO SENSOR:<br>" +
          error.name +
          " — " +
          error.message;

      }

    }


    /* LEITURA DO SENSOR */

    function mostrarOrientacao(event) {


      /*

        GAMMA REPRESENTA
        A INCLINAÇÃO PARA
        ESQUERDA / DIREITA

      */

      const gamma =
        event.gamma || 0;


      /*

        TRANSFORMA O GAMMA
        EM POSIÇÃO NA TELA

      */

      const posicao =
        50 - (gamma / 45) * 30;


      /*

        MOVE A BOLINHA

      */

      bolinha.style.left =
        posicao + "%";


      /* ALPHA */

      const alpha =
        event.alpha !== null
          ? Math.round(event.alpha)
          : "N/A";


      /* BETA */

      const beta =
        event.beta !== null
          ? Math.round(event.beta)
          : "N/A";


      /* GAMMA */

      const gammaTexto =
        event.gamma !== null
          ? Math.round(event.gamma)
          : "N/A";


      /* MOSTRA OS VALORES */

      message.innerHTML =

        "VIRE O CELULAR<br><br>" +

        "ALPHA: " +
        alpha +
        "°<br>" +

        "BETA: " +
        beta +
        "°<br>" +

        "GAMMA: " +
        gammaTexto +
        "°";

    }


  </script>


</body>

</html>
