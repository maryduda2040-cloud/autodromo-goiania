<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Autódromo de Goiânia</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

      font-family: Arial, sans-serif;

    }


    /* =========================
       CÂMERA
    ========================= */

    #camera {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;

    }


    /* =========================
       CANVAS DA PISTA
    ========================= */

    #gameCanvas {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 5;

      pointer-events: none;

    }


    /* =========================
       VÍDEO INVISÍVEL
    ========================= */

    #trackVideo {

      display: none;

    }


    /* =========================
       TELA INICIAL
    ========================= */

    #startScreen {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #111;

      z-index: 10;

    }


    /* =========================
       BOTÃO
    ========================= */

    #startButton {

      border: none;

      padding: 18px 32px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      background: white;

      color: #111;

    }


    /* =========================
       MENSAGEM
    ========================= */

    #message {

      position: fixed;

      top: 20px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      color: white;

      background: rgba(0, 0, 0, 0.65);

      padding: 10px 15px;

      border-radius: 8px;

      font-size: 16px;

      text-align: center;

      display: none;

    }


    /* =========================
       TELA FINAL
    ========================= */

    #finishScreen {

      position: fixed;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      background: #111;

      color: white;

      z-index: 30;

      text-align: center;

      padding: 30px;

    }


    #finishScreen h1 {

      font-size: 32px;

      margin: 0;

    }

  </style>

</head>


<body>


  <!-- =========================
       CÂMERA
  ========================= -->

  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>


  <!-- =========================
       VÍDEO DA PISTA
  ========================= -->

  <video
    id="trackVideo"
    src="pista.mp4"
    muted
    playsinline
  ></video>


  <!-- =========================
       CANVAS
  ========================= -->

  <canvas
    id="gameCanvas"
  ></canvas>


  <!-- =========================
       TELA INICIAL
  ========================= -->

  <div id="startScreen">

    <button id="startButton">
      INICIAR CORRIDA
    </button>

  </div>


  <!-- =========================
       MENSAGEM
  ========================= -->

  <div id="message"></div>


  <!-- =========================
       TELA FINAL
  ========================= -->

  <div id="finishScreen">

    <h1>
      VOCÊ FINALIZOU SUA CORRIDA
    </h1>

  </div>


  <script>


    /* =========================
       ELEMENTOS
    ========================= */

    const camera =
      document.getElementById(
        "camera"
      );


    const trackVideo =
      document.getElementById(
        "trackVideo"
      );


    const canvas =
      document.getElementById(
        "gameCanvas"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    const startScreen =
      document.getElementById(
        "startScreen"
      );


    const startButton =
      document.getElementById(
        "startButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    const finishScreen =
      document.getElementById(
        "finishScreen"
      );


    /* =========================
       CONFIGURAÇÃO
    ========================= */

    /*
      COR DO FUNDO DO VÍDEO

      O fundo do seu vídeo é
      aproximadamente RGB 52,52,52.
    */

    const cinzaR = 52;
    const cinzaG = 52;
    const cinzaB = 52;


    /*
      TOLERÂNCIA

      Quanto maior esse número,
      mais tons de cinza serão
      considerados transparentes.

    */

    const tolerancia = 25;


    /* =========================
       AJUSTA CANVAS
    ========================= */

    function ajustarCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

    }


    ajustarCanvas();


    window.addEventListener(
      "resize",
      ajustarCanvas
    );


    /* =========================
       BOTÃO INICIAR
    ========================= */

    startButton.addEventListener(
      "click",
      iniciarJogo
    );


    /* =========================
       INICIAR JOGO
    ========================= */

    async function iniciarJogo() {


      startButton.disabled =
        true;


      startButton.textContent =
        "ABRINDO CÂMERA...";


      try {


        /* =====================
           ABRIR CÂMERA
        ===================== */

        const stream =
          await navigator
            .mediaDevices
            .getUserMedia({

              video: {

                facingMode:
                  "environment"

              },

              audio: false

            });


        camera.srcObject =
          stream;


        /*
          Espera a câmera
          começar a funcionar.
        */

        await camera.play();


        /* =====================
           ESCONDE TELA INICIAL
        ===================== */

        startScreen.style.display =
          "none";


        /* =====================
           COMEÇA VÍDEO
        ===================== */

        trackVideo.currentTime =
          0;


        await trackVideo.play();


        /* =====================
           COMEÇA PROCESSAMENTO
        ===================== */

        desenharVideo();


      }


      catch (error) {


        console.error(
          error
        );


        startButton.disabled =
          false;


        startButton.textContent =
          "INICIAR CORRIDA";


        message.style.display =
          "block";


        message.textContent =
          "Não foi possível abrir a câmera.";

      }

    }


    /* =========================
       PROCESSA O VÍDEO
    ========================= */

    function desenharVideo() {


      /*
        Se o vídeo ainda não
        estiver pronto, espera.
      */

      if (
        trackVideo.readyState <
        2
      ) {

        requestAnimationFrame(
          desenharVideo
        );

        return;

      }


      /*
        Tamanho original
        do vídeo.

      */

      const videoWidth =
        trackVideo.videoWidth;


      const videoHeight =
        trackVideo.videoHeight;


      /*
        Calcula a escala para
        preencher a tela mantendo
        a proporção.

      */

      const escala =
        Math.max(

          canvas.width /
            videoWidth,

          canvas.height /
            videoHeight

        );


      const largura =
        videoWidth *
        escala;


      const altura =
        videoHeight *
        escala;


      /*
        Centraliza o vídeo.

      */

      const x =
        (canvas.width -
          largura) /
        2;


      const y =
        (canvas.height -
          altura) /
        2;


      /*
        Desenha o quadro
        do vídeo.

      */

      ctx.drawImage(

        trackVideo,

        x,
        y,

        largura,
        altura

      );


      /*
        Pega os pixels.

      */

      const imagem =
        ctx.getImageData(

          0,
          0,

          canvas.width,
          canvas.height

        );


      const pixels =
        imagem.data;


      /*
        Percorre todos
        os pixels.

      */

      for (
        let i = 0;
        i < pixels.length;
        i += 4
      ) {


        const r =
          pixels[i];


        const g =
          pixels[i + 1];


        const b =
          pixels[i + 2];


        /*
          Calcula diferença
          em relação ao cinza.

        */

        const diferenca =

          Math.abs(
            r - cinzaR
          )

          +

          Math.abs(
            g - cinzaG
          )

          +

          Math.abs(
            b - cinzaB
          );


        /*
          Se estiver próximo
          do cinza do fundo,
          torna transparente.

        */

        if (
          diferenca <
          tolerancia * 3
        ) {


          pixels[i + 3] =
            0;

        }

      }


      /*
        Coloca os pixels
        processados de volta.

      */

      ctx.putImageData(
        imagem,
        0,
        0
      );


      /*
        Continua processando
        o próximo quadro.

      */

      if (
        !trackVideo.paused &&
        !trackVideo.ended
      ) {

        requestAnimationFrame(
          desenharVideo
        );

      }

    }


    /* =========================
       FINAL DA CORRIDA
    ========================= */

    trackVideo.addEventListener(
      "ended",
      corridaTerminou
    );


    function corridaTerminou() {


      /*
        Mostra tela final.

      */

      finishScreen.style.display =
        "flex";


      /*
        Para câmera.

      */

      if (
        camera.srcObject
      ) {


        const tracks =
          camera.srcObject
            .getTracks();


        tracks.forEach(
          track => track.stop()
        );

      }

    }


  </script>


</body>

</html>
