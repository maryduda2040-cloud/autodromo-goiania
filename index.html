<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Autódromo de Goiânia — Jogo</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #111;

    }


    /* CÂMERA */

    #camera {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

    }


    /* TELA INICIAL */

    #start {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #111;

      z-index: 10;

    }


    /* BOTÃO */

    button {

      border: none;

      padding: 18px 30px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    /* TEXTO */

    #message {

      position: fixed;

      top: 20px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      color: white;

      font-size: 20px;

      font-weight: bold;

      text-align: center;

      text-shadow: 0 2px 5px #000;

      padding: 10px;

    }


    /* BOLINHA */

    #teste {

      position: fixed;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      width: 50px;

      height: 50px;

      border-radius: 50%;

      background: white;

      z-index: 6;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.5);

    }


    /*
      MENSAGEM DE ORIENTAÇÃO
    */

    #orientationMessage {

      position: fixed;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      background: #111;

      color: white;

      z-index: 30;

      text-align: center;

      padding: 30px;

    }


    #orientationMessage h1 {

      margin: 0 0 15px;

      font-size: 28px;

    }


    #orientationMessage p {

      margin: 0;

      font-size: 18px;

    }

  </style>

</head>


<body>


  <!-- TELA INICIAL -->

  <div id="start">

    <button id="startButton">
      INICIAR CORRIDA
    </button>

  </div>


  <!-- CÂMERA -->

  <video
    id="camera"
    autoplay
    playsinline
  ></video>


  <!-- MENSAGEM -->

  <div id="message">
    VIRE O CELULAR
  </div>


  <!-- BOLINHA -->

  <div id="teste"></div>


  <!-- MENSAGEM DE ORIENTAÇÃO -->

  <div id="orientationMessage">

    <h1>
      VIRE O CELULAR
    </h1>

    <p>
      Coloque o celular na horizontal
    </p>

  </div>


  <script>


    /* ELEMENTOS */

    const start =
      document.getElementById("start");

    const startButton =
      document.getElementById("startButton");

    const camera =
      document.getElementById("camera");

    const message =
      document.getElementById("message");

    const bolinha =
      document.getElementById("teste");

    const orientationMessage =
      document.getElementById("orientationMessage");


    /* CONTROLE */

    let cameraAtiva = false;


    /*
      VERIFICA SE O CELULAR
      ESTÁ EM PAISAGEM
    */

    function verificarOrientacao() {

      const horizontal =
        window.innerWidth >
        window.innerHeight;


      if (horizontal) {

        orientationMessage.style.display =
          "none";

      } else {

        orientationMessage.style.display =
          "flex";

      }

    }


    /*
      VERIFICA A ORIENTAÇÃO
      QUANDO A PÁGINA ABRE
    */

    verificarOrientacao();


    /*
      VERIFICA NOVAMENTE
      QUANDO O CELULAR GIRA
    */

    window.addEventListener(
      "resize",
      verificarOrientacao
    );


    window.addEventListener(
      "orientationchange",
      verificarOrientacao
    );


    /* BOTÃO INICIAR */

    startButton.addEventListener(
      "click",
      async () => {


        message.textContent =
          "ABRINDO CÂMERA...";


        try {


          /* CÂMERA TRASEIRA */

          const stream =
            await navigator.mediaDevices.getUserMedia({

              video: {

                facingMode: "environment"

              },

              audio: false

            });


          camera.srcObject =
            stream;


          cameraAtiva =
            true;


          /* ESCONDE TELA INICIAL */

          start.style.display =
            "none";


          /*
            ATIVA O SENSOR
          */

          message.innerHTML =
            "CÂMERA FUNCIONANDO!<br><br>" +
            "TOQUE AQUI PARA ATIVAR O SENSOR";


          message.style.background =
            "rgba(0,0,0,0.7)";


          message.style.color =
            "white";


          message.style.padding =
            "15px";


          message.addEventListener(
            "click",
            ativarSensor
          );


        }


        catch (error) {


          message.textContent =
            "ERRO DA CÂMERA: " +
            error.name +
            " — " +
            error.message;

        }

      }
    );


    /* ATIVAR SENSOR */

    async function ativarSensor() {


      message.removeEventListener(
        "click",
        ativarSensor
      );


      try {


        /*
          PERMISSÃO DO SENSOR
        */

        if (

          typeof DeviceOrientationEvent !==
          "undefined"

          &&

          typeof DeviceOrientationEvent
            .requestPermission ===
          "function"

        ) {


          const permission =
            await DeviceOrientationEvent
              .requestPermission();


          if (
            permission !== "granted"
          ) {


            message.textContent =
              "PERMISSÃO DO SENSOR NÃO CONCEDIDA.";

            return;

          }

        }


        /*
          ATIVA O SENSOR
        */

        window.addEventListener(

          "deviceorientation",

          mostrarOrientacao

        );


        message.innerHTML =
          "SENSOR ATIVADO";


        /*
          MOSTRA A ORIENTAÇÃO
        */

        verificarOrientacao();


      }


      catch (error) {


        message.innerHTML =
          "ERRO DO SENSOR:<br>" +
          error.name +
          " — " +
          error.message;

      }

    }


    /*
      MOVIMENTO DO CELULAR
    */

    function mostrarOrientacao(event) {


      const gamma =
        event.gamma || 0;


      /*
        MOVIMENTO DA BOLINHA
      */

      const posicao =
        50 - (gamma / 45) * 30;


      bolinha.style.left =
        posicao + "%";


      /*
        MOSTRA GAMMA
      */

      message.innerHTML =

        "SENSOR ATIVO<br><br>" +

        "GAMMA: " +

        Math.round(gamma) +

        "°";

    }

  </script>


</body>

</html>
